name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lint-and-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m pytest tests/test_api.py tests/test_distribution.py -q
      - run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: hailo-libero-manual-install
          path: dist/*.zip
  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.test -t hailo-tests .
      - run: docker run --rm hailo-tests